<!DOCTYPE html>
<html lang="en">

<title>Santoria · Radio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;
  background:url("https://thumbs.dreamstime.com/b/white-gold-marble-textured-background-abstract-design-k-wallpaper-white-gold-marble-textured-background-abstract-design-k-271738110.jpg") center/cover fixed no-repeat;
  color:#1a2a4a;user-select:none;touch-action:manipulation;
}
button,input{font:inherit}
button{border:0}
#loginScreen,#radioPage{width:100%}
#loginScreen{max-width:420px;background:rgba(255,255,255,.94);backdrop-filter:blur(32px) saturate(240%);-webkit-backdrop-filter:blur(32px) saturate(240%);border-radius:44px;padding:44px 32px;box-shadow:0 30px 60px rgba(0,0,0,.08),0 0 0 1px rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.12)}
.login-header{text-align:center;margin-bottom:28px}.login-header img{height:60px;width:auto;object-fit:contain;margin-bottom:12px}.login-header p{color:#5a6a8a;font-size:.9rem}
.login-form{display:flex;flex-direction:column;gap:16px}.input-group{position:relative}.input-group i{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#d4af37}
.login-form input{width:100%;padding:15px 16px 15px 48px;background:#f5f0eb;border:1px solid rgba(26,42,74,.08);border-radius:60px;color:#1a2a4a;font-size:1rem;outline:none;transition:.2s}
.login-form input:focus{border-color:#d4af37;background:#fff;box-shadow:0 0 0 3px rgba(212,175,55,.08)}
.login-btn,.continue-btn{background:#1a2a4a;color:#fff;cursor:pointer;transition:.2s}.login-btn{padding:15px;border-radius:60px;font-size:1.05rem;font-weight:600;letter-spacing:2px;text-transform:uppercase}.login-btn:hover,.continue-btn:hover{transform:translateY(-1px)}.login-btn:active,.continue-btn:active{transform:scale(.97)}
.login-error{color:#b38b17;font-size:.8rem;text-align:center;min-height:18px;opacity:0;transition:.2s}.login-error.show{opacity:1}
.login-footer{text-align:center;margin-top:24px;font-size:.6rem;color:#9aabbf;letter-spacing:1px;text-transform:uppercase}.login-footer i{color:#d4af37;margin-right:4px}

#welcomeOverlay{position:fixed;inset:0;background:rgba(255,255,255,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;z-index:9999}
#welcomeOverlay.show{display:flex}
.welcome-card{text-align:center;padding:48px 36px;background:#fff;border-radius:48px;border:1px solid rgba(212,175,55,.08);box-shadow:0 40px 80px rgba(0,0,0,.04);max-width:500px;width:90%}
.welcome-icon{font-size:64px;color:#d4af37;display:block;margin-bottom:16px}.welcome-card h2{font-size:29px;margin-bottom:8px}.welcome-card p{color:#5a6a8a;margin-bottom:24px}.continue-btn{padding:13px 40px;border-radius:60px;font-weight:600}

#radioPage{display:none;max-width:820px;animation:fadeIn .3s ease}.santoria-panel{width:100%;background:rgba(255,255,255,.88);background-image:url("https://i.postimg.cc/66rWZyVK/new-logo.png");background-size:80%;background-position:center bottom 30px;background-repeat:no-repeat;backdrop-filter:blur(32px) saturate(240%);-webkit-backdrop-filter:blur(32px) saturate(240%);border-radius:52px;padding:30px 28px;box-shadow:0 40px 80px rgba(0,0,0,.04),0 0 0 1px rgba(212,175,55,.06);border:1px solid rgba(212,175,55,.06);overflow:hidden}
.santoria-content{position:relative;z-index:2}
.santoria-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid rgba(26,42,74,.05);gap:10px;flex-wrap:wrap}
.brand img{height:55px;width:auto;object-fit:contain}.user-info,.status-badge{background:#f5f0eb;border-radius:60px;display:flex;align-items:center}.user-info{gap:10px;padding:6px 16px}.user-info i{color:#d4af37}.username-display{font-size:.8rem;font-weight:500}.status-badge{padding:6px 14px;font-size:.55rem;letter-spacing:.8px;text-transform:uppercase;color:#b38b17;gap:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status-badge i{font-size:.4rem}
.track-area{display:flex;align-items:center;gap:20px;margin-bottom:18px}.cover-art{width:120px;height:120px;min-width:120px;background:#f5f0eb;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:56px;color:#d4af37;box-shadow:0 20px 40px -10px rgba(0,0,0,.02)}.track-info{min-width:0}.track-name{font-size:clamp(1.35rem,5vw,2.2rem);font-weight:600;overflow:hidden;text-overflow:ellipsis}.artist-name{font-size:1rem;color:#5a6a8a;display:flex;gap:7px;align-items:center;margin-top:4px}.artist-name i{font-size:.4rem;color:#d4af37}
.visualizer{display:flex;align-items:center;justify-content:center;gap:6px;height:56px;margin:8px 0 18px;background:#f5f0eb;border-radius:60px;padding:5px 24px}.bar{width:6px;height:28px;background:linear-gradient(to top,#d4af37,#f5d97a);border-radius:10px;animation:pulseBar 1s infinite alternate ease-in-out;opacity:.6}.bar:nth-child(2n){animation-duration:1.4s}.bar:nth-child(3n){animation-duration:.7s}.bar:nth-child(4n){animation-duration:1.7s}@keyframes pulseBar{0%{transform:scaleY(.2);opacity:.3}100%{transform:scaleY(1);opacity:.9}}
.progress-container{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.progress-bar{flex:1;height:7px;background:rgba(26,42,74,.09);border-radius:10px;position:relative;cursor:pointer;touch-action:none}.progress-fill{height:100%;width:0;background:linear-gradient(to right,#d4af37,#f5d97a);border-radius:10px;position:relative}.progress-fill:after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:#d4af37;border-radius:50%;box-shadow:0 0 20px rgba(212,175,55,.3)}.time-display{font-size:.75rem;color:#5a6a8a;font-weight:500;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;margin:22px 0 4px}.controls button{background:#f5f0eb;color:#1a2a4a;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.03);transition:.15s}.controls button:active{transform:scale(.9)}.controls .play-btn{background:#1a2a4a;color:#fff;width:78px;height:78px;font-size:2.2rem;box-shadow:0 8px 28px rgba(26,42,74,.12)}
.volume-container{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding:8px 16px;background:#f5f0eb;border-radius:60px}.volume-container>i{color:#9aabbf;font-size:.8rem}.volume-container input{width:140px;accent-color:#d4af37}.volume-container button{background:none;color:#9aabbf;cursor:pointer;padding:5px;border-radius:50%}.santoria-footer{text-align:center;margin-top:20px;font-size:.52rem;letter-spacing:1.2px;color:#9aabbf;border-top:1px solid rgba(26,42,74,.04);padding-top:13px;display:flex;justify-content:center;gap:20px;text-transform:uppercase;flex-wrap:wrap}.santoria-footer i{color:#d4af37;margin-right:4px}audio{display:none}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
@media(max-width:600px){body{padding:8px}.santoria-panel{padding:22px 16px;border-radius:34px}.cover-art{width:76px;height:76px;min-width:76px;font-size:34px;border-radius:24px}.track-area{gap:14px}.santoria-header{justify-content:center}.brand{width:100%;text-align:center}.brand img{height:48px}.status-badge{max-width:100%}.visualizer{height:46px}.bar{width:5px}.volume-container input{width:100px}}
@media(max-width:390px){#loginScreen{padding:34px 20px;border-radius:34px}.welcome-card{padding:38px 22px}.controls .play-btn{width:66px;height:66px}.time-display{min-width:42px;font-size:.65rem}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-header">
    <img src="https://i.postimg.cc/TYc3zphK/new-logo-2.png" alt="Santoria">
    <p>Enter credentials to access the radio</p>
  </div>
  <form class="login-form" id="loginForm" autocomplete="off">
    <div class="input-group"><i class="fas fa-user"></i><input id="username" type="text" placeholder="Username" autocomplete="username" required></div>
    <div class="input-group"><i class="fas fa-lock"></i><input id="password" type="password" placeholder="Password" autocomplete="current-password" required></div>
    <button class="login-btn" type="submit">Login</button>
    <div class="login-error" id="loginError" aria-live="polite">Invalid username or password</div>
  </form>
  <div class="login-footer"><i class="fas fa-radio"></i> santoria · radio system</div>
</div>

<div id="welcomeOverlay">
  <div class="welcome-card">
    <span class="welcome-icon"><i class="fas fa-check-circle"></i></span>
    <h2>Welcome!</h2>
    <p id="welcomeMessage"></p>
    <button class="continue-btn" id="continueBtn" type="button">Continue to Radio</button>
  </div>
</div>

<div id="radioPage">
  <div class="santoria-panel">
    <div class="santoria-content">
      <div class="santoria-header">
        <div class="brand"><img src="https://i.postimg.cc/TYc3zphK/new-logo-2.png" alt="Santoria"></div>
        <div class="user-info"><i class="fas fa-user-circle"></i><span class="username-display" id="displayUsername">Guest</span></div>
        <div class="status-badge" id="statusBadge"><i class="fas fa-circle"></i> ready · radio</div>
      </div>

      <div class="track-area">
        <div class="cover-art"><i class="fas fa-record-vinyl"></i></div>
        <div class="track-info">
          <div class="track-name" id="trackName">Loading...</div>
          <div class="artist-name"><i class="fas fa-asterisk"></i><span id="artistName">Santoria studio</span></div>
        </div>
      </div>

      <div class="visualizer" aria-hidden="true">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>

      <div class="progress-container">
        <span class="time-display" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" role="slider" aria-label="Seek audio"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time-display" id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <button class="play-btn" id="playBtn" type="button" aria-label="Play"><i class="fas fa-play"></i></button>
      </div>

      <div class="volume-container">
        <i class="fas fa-volume-low"></i>
        <input id="volumeSlider" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume">
        <i class="fas fa-volume-high"></i>
        <button id="muteBtn" type="button" title="Mute" aria-label="Mute"><i class="fas fa-volume-high"></i></button>
      </div>

      <div class="santoria-footer">
        <span><i class="fas fa-radio"></i> fm · santoria</span>
        <span><i class="fas fa-waveform"></i> always on</span>
        <span><i class="fas fa-crown"></i> maison santoria</span>
      </div>
    </div>
  </div>
</div>

<audio id="santoriaAudio" preload="metadata" playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
(() => {
"use strict";

/* =========================================================
   CONFIGURATION
   ========================================================= */
const EMAILJS_CONFIG = {
  publicKey: "YOUR_PUBLIC_KEY_HERE",
  serviceID: "YOUR_SERVICE_ID_HERE",
  templateID: "YOUR_TEMPLATE_ID_HERE"
};

const GOOGLE_SHEETS_WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycby33aAGvcjTEL-9UtHx6kVppgZmvm1ujIivJLyZ2vlIoqGVoA_RvAZkWlQWoH6F-FeF/exec";

/* =========================================================
   USERS
   NOTE: Client-side passwords are visible to anyone who can
   inspect the page. Use a real backend for true security.
   ========================================================= */
const users = [
{username:"MG001",password:"20321",welcome:"WELCOME MAJIDI MALL SANTOIRA"},
{username:"MG002",password:"45321",welcome:"WELCOME FAMILY MALL BISSE"},
{username:"MG006",password:"97863",welcome:"WELCOME MAJIDI MALL SANTOIRA OUTLET"},
{username:"MG010",password:"33107",welcome:"WELCOME FAMILY MALL SANTORIA"},
{username:"MG011",password:"13561",welcome:"WELCOME SULYEMANIYE MAJIDI MALL SANTORIA"},
{username:"MG012",password:"14328",welcome:"WELCOME DUHOK FAMILY MALL SANTOIRA"},
{username:"MG013",password:"19733",welcome:"WELCOME BAGDAT MALL SANTORIA"},
{username:"MG014",password:"14434",welcome:"WELCOME DREAM MALL SANTORIA"},
{username:"MG015",password:"35355",welcome:"WELCOME ZYOONA MALL SANTORIA"},
{username:"MG016",password:"99779",welcome:"WELCOME GULAN MALL SANTORIA"},
{username:"MG017",password:"34968",welcome:"WELCOME SULYEMANIYE FAMILY MALL SANTORIA"},
{username:"MG018",password:"20045",welcome:"WELCOME GRAND MAJIDI MALL SANTORIA"},
{username:"MG019",password:"44333",welcome:"WELCOME ANKAWA STREET SANTORIA"},
{username:"MG021",password:"66554",welcome:"WELCOME ALMANSOUR MALL SANTORIA"},
{username:"MG022",password:"22002",welcome:"WELCOME KERKUK MALL SANTORIA"},
{username:"MG023",password:"23439",welcome:"WELCOME KERBELA AL-HARITH MALL SANTORIA"},
{username:"MG024",password:"72443",welcome:"WELCOME JADREYA MALL SANTORIA"},
{username:"MG025",password:"43791",welcome:"WELCOME BASRA TIME-SQUIR MALL SANTORIA"},
{username:"MG026",password:"65676",welcome:"WELCOME SULYEMANIYE CADDE ASTI SANTORIA"},
{username:"MG027",password:"39347",welcome:"WELCOME IRAQ MALL SANTORIA"},
{username:"MG028",password:"41171",welcome:"WELCOME SHORSH STREET SANTORIA"},
{username:"MG029",password:"66567",welcome:"WELCOME NECEF FIRAT MALL SANTORIA"},
{username:"MG030",password:"37794",welcome:"WELCOME CADDEE ARASAT SANTORIA"},
{username:"MG031",password:"43131",welcome:"WELCOME DUHOK KRO SANTORIA"},
{username:"CEO",password:"05502026",welcome:"WELCOME CEO"},
{username:"DPM",password:"147823",welcome:"WELCOME DEPO SANTORIA"},
{username:"ADMIN",password:"0000987789",welcome:"WELCOME SYSTEM"}
];

/* =========================================================
   PLAYLIST
   ========================================================= */
const playlist = [
{src:"https://files.catbox.moe/zlf4uh.mp3",name:"سورة البقرة",artist:"Santoria studio"},
{src:"https://files.catbox.moe/ozwroe.mp3",name:"Morning Vibes",artist:"Santoria studio"},
{src:"https://files.catbox.moe/30wghp.mp3",name:"Giorgio Armani",artist:"Santoria studio"},
{src:"https://files.catbox.moe/gwq0wf.mp3",name:"Gucci",artist:"Santoria studio"},
{src:"https://files.catbox.moe/8y6yh7.mp3",name:"Hugo Boss",artist:"Santoria studio"},
{src:"https://files.catbox.moe/0qftm3.mp3",name:"Prada",artist:"Santoria studio"},
{src:"https://files.catbox.moe/cs7u9k.mp3",name:"Chanel",artist:"Santoria studio"}
];

/* =========================================================
   DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const loginScreen=$("loginScreen"), loginForm=$("loginForm"), usernameInput=$("username"), passwordInput=$("password");
const loginError=$("loginError"), welcomeOverlay=$("welcomeOverlay"), welcomeMessage=$("welcomeMessage"), continueBtn=$("continueBtn");
const radioPage=$("radioPage"), displayUsername=$("displayUsername"), audio=$("santoriaAudio"), playBtn=$("playBtn");
const muteBtn=$("muteBtn"), volumeSlider=$("volumeSlider"), progressFill=$("progressFill"), progressBar=$("progressBar");
const currentTimeEl=$("currentTime"), totalTimeEl=$("totalTime"), trackNameEl=$("trackName"), artistNameEl=$("artistName"), statusBadge=$("statusBadge");

/* =========================================================
   STATE
   ========================================================= */
let currentTrackIndex=0;
let currentUser=null;
let isDragging=false;
let loginTimestamp=null;
let logoutTracked=false;
let hasStartedRadio=false;
let lastVolume=.8;

/* =========================================================
   EMAILJS
   ========================================================= */
const emailReady =
  typeof emailjs !== "undefined" &&
  EMAILJS_CONFIG.publicKey &&
  !EMAILJS_CONFIG.publicKey.startsWith("YOUR_") &&
  EMAILJS_CONFIG.serviceID &&
  !EMAILJS_CONFIG.serviceID.startsWith("YOUR_") &&
  EMAILJS_CONFIG.templateID &&
  !EMAILJS_CONFIG.templateID.startsWith("YOUR_");

if(emailReady){
  try{emailjs.init({publicKey:EMAILJS_CONFIG.publicKey});}
  catch(err){console.warn("EmailJS initialization failed:",err);}
}

function sendLoginNotification(user){
  if(!emailReady) return;
  const now=new Date();
  emailjs.send(EMAILJS_CONFIG.serviceID,EMAILJS_CONFIG.templateID,{
    username:user.username,
    welcome:user.welcome,
    date:now.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}),
    time:now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})
  }).catch(err=>console.warn("Email notification failed:",err));
}

/* =========================================================
   GOOGLE SHEETS
   FIX: removed the accidental "{exec" syntax error and the
   old comparison that disabled the supplied URL.
   ========================================================= */
function sendToSheets(data){
  if(!GOOGLE_SHEETS_WEBAPP_URL) return;

  const body=JSON.stringify(data);

  try{
    if(navigator.sendBeacon){
      const blob=new Blob([body],{type:"text/plain;charset=UTF-8"});
      const queued=navigator.sendBeacon(GOOGLE_SHEETS_WEBAPP_URL,blob);
      if(queued) return;
    }
  }catch(err){console.warn("sendBeacon failed:",err)}

  fetch(GOOGLE_SHEETS_WEBAPP_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=UTF-8"},
    body
  }).catch(err=>console.warn("Sheets tracking failed:",err));
}

function trackingData(user,action,duration=""){
  const now=new Date();
  return {
    username:user.username,
    date:now.toLocaleDateString("en-US",{year:"numeric",month:"2-digit",day:"2-digit"}),
    time:now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}),
    day:now.toLocaleDateString("en-US",{weekday:"long"}),
    action,
    duration,
    timestamp:now.toISOString()
  };
}
function trackLogin(user){
  loginTimestamp=new Date();
  sendToSheets(trackingData(user,"LOGIN"));
}
function trackLogout(user){
  if(!user || logoutTracked) return;
  logoutTracked=true;
  const duration=loginTimestamp ? Math.floor((Date.now()-loginTimestamp.getTime())/60000)+" minutes" : "";
  sendToSheets(trackingData(user,"LOGOUT",duration));
}

window.addEventListener("pagehide",()=>trackLogout(currentUser));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden") {
    /* Do not mark logout here: switching tabs should not be a logout. */
  }
});

/* =========================================================
   LOGIN
   ========================================================= */
loginForm.addEventListener("submit",e=>{
  e.preventDefault();

  const username=usernameInput.value.trim().toUpperCase();
  const password=passwordInput.value.trim();
  const user=users.find(u=>u.username===username && u.password===password);

  if(!user){
    loginError.textContent="Invalid username or password";
    loginError.classList.add("show");
    setTimeout(()=>loginError.classList.remove("show"),3000);
    return;
  }

  currentUser=user;
  logoutTracked=false;
  loginError.classList.remove("show");
  welcomeMessage.textContent=user.welcome;
  welcomeOverlay.classList.add("show");
  loginScreen.style.display="none";

  sendLoginNotification(user);
  trackLogin(user);
});

/* =========================================================
   RADIO START
   A user click on Continue provides the browser's audio
   permission, so playback can start reliably.
   ========================================================= */
continueBtn.addEventListener("click",async()=>{
  welcomeOverlay.classList.remove("show");
  radioPage.style.display="block";
  displayUsername.textContent=currentUser?.username || "Guest";
  hasStartedRadio=true;

  loadTrack(0);
  setVolume(.8);

  try{
    await audio.play();
    setPlayingUI(true);
  }catch(err){
    /* Some browsers may still block playback. The Play button remains available. */
    setPlayingUI(false);
  }
});

/* =========================================================
   PLAYER
   ========================================================= */
function loadTrack(index){
  if(!playlist.length) return;
  currentTrackIndex=(index+playlist.length)%playlist.length;
  const track=playlist[currentTrackIndex];

  trackNameEl.textContent=track.name;
  artistNameEl.textContent=track.artist;
  statusBadge.innerHTML='<i class="fas fa-circle"></i> '+escapeHtml(track.name)+' · radio';

  progressFill.style.width="0%";
  currentTimeEl.textContent="0:00";
  totalTimeEl.textContent="0:00";

  audio.src=track.src;
  audio.load();
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function formatTime(seconds){
  if(!Number.isFinite(seconds)||seconds<0) return "0:00";
  const mins=Math.floor(seconds/60);
  const secs=Math.floor(seconds%60);
  return mins+":"+(secs<10?"0":"")+secs;
}

function setPlayingUI(playing){
  playBtn.innerHTML=playing?'<i class="fas fa-pause"></i>':'<i class="fas fa-play"></i>';
  playBtn.setAttribute("aria-label",playing?"Pause":"Play");
}

async function togglePlay(){
  if(!playlist.length) return;

  if(audio.paused){
    if(audio.ended){
      loadTrack((currentTrackIndex+1)%playlist.length);
    }
    try{
      await audio.play();
      setPlayingUI(true);
    }catch(err){
      console.warn("Playback failed:",err);
    }
  }else{
    audio.pause();
    setPlayingUI(false);
  }
}

playBtn.addEventListener("click",e=>{
  e.preventDefault();
  togglePlay();
});

function setVolume(value){
  const v=Math.max(0,Math.min(1,Number(value)));
  audio.volume=v;
  volumeSlider.value=v;
  if(v>0) lastVolume=v;
  updateMuteIcon();
}
function updateMuteIcon(){
  if(audio.muted||audio.volume===0) muteBtn.innerHTML='<i class="fas fa-volume-mute"></i>';
  else if(audio.volume<.5) muteBtn.innerHTML='<i class="fas fa-volume-low"></i>';
  else muteBtn.innerHTML='<i class="fas fa-volume-high"></i>';
}
function toggleMute(){
  if(audio.muted || audio.volume===0){
    audio.muted=false;
    setVolume(lastVolume||.8);
  }else{
    lastVolume=audio.volume;
    audio.muted=true;
  }
  updateMuteIcon();
}
muteBtn.addEventListener("click",toggleMute);
volumeSlider.addEventListener("input",e=>{
  audio.muted=false;
  setVolume(e.target.value);
});

/* =========================================================
   PROGRESS / SEEK
   FIX: pointer events replace separate mouse/touch handling,
   preventing duplicate touch+click behavior.
   ========================================================= */
function updateProgress(){
  if(isDragging) return;
  if(Number.isFinite(audio.duration) && audio.duration>0){
    progressFill.style.width=(audio.currentTime/audio.duration*100)+"%";
    currentTimeEl.textContent=formatTime(audio.currentTime);
    totalTimeEl.textContent=formatTime(audio.duration);
  }
}

function seekToClientX(clientX){
  const rect=progressBar.getBoundingClientRect();
  if(!rect.width || !Number.isFinite(audio.duration) || audio.duration<=0) return;

  const ratio=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
  const newTime=ratio*audio.duration;

  try{audio.currentTime=newTime;}catch(_){}
  progressFill.style.width=(ratio*100)+"%";
  currentTimeEl.textContent=formatTime(newTime);
}

progressBar.addEventListener("pointerdown",e=>{
  if(!Number.isFinite(audio.duration)||audio.duration<=0) return;
  e.preventDefault();
  isDragging=true;
  try{progressBar.setPointerCapture(e.pointerId)}catch(_){}
  seekToClientX(e.clientX);
});
progressBar.addEventListener("pointermove",e=>{
  if(!isDragging) return;
  e.preventDefault();
  seekToClientX(e.clientX);
});
progressBar.addEventListener("pointerup",e=>{
  if(!isDragging) return;
  e.preventDefault();
  seekToClientX(e.clientX);
  isDragging=false;
});
progressBar.addEventListener("pointercancel",()=>{isDragging=false});

audio.addEventListener("timeupdate",updateProgress);
audio.addEventListener("loadedmetadata",updateProgress);
audio.addEventListener("durationchange",updateProgress);

audio.addEventListener("play",()=>setPlayingUI(true));
audio.addEventListener("pause",()=>setPlayingUI(false));
audio.addEventListener("error",()=>{
  setPlayingUI(false);
  statusBadge.innerHTML='<i class="fas fa-triangle-exclamation"></i> audio unavailable';
  console.warn("Could not load:",playlist[currentTrackIndex]?.src);
});

audio.addEventListener("ended",async()=>{
  const next=(currentTrackIndex+1)%playlist.length;
  loadTrack(next);
  try{
    await audio.play();
    setPlayingUI(true);
  }catch(err){
    setPlayingUI(false);
  }
});

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener("keydown",e=>{
  if(!radioPage || radioPage.style.display==="none") return;
  if(e.code==="Space" && e.target.tagName!=="INPUT"){
    e.preventDefault();
    togglePlay();
  }
});

/* =========================================================
   INITIALIZE
   ========================================================= */
setVolume(.8);
loadTrack(0);

console.log("Santoria Radio initialized.");
console.log("Fixed: JavaScript syntax error, Google Sheets tracking, EmailJS placeholders, touch double-toggle, seeking, autoplay flow and audio error handling.");

})();
